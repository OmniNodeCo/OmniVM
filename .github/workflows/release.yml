# Publishes a GitHub Release with the executables.
#
# Trigger: push a version tag, e.g.
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must start with "v". Archives built by build.yml are attached,
# along with a checksums.txt (sha256).

name: Release executables

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build all platforms
    uses: ./.github/workflows/build.yml

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # artifacts arrive as single zips of files/folders (no nested archives):
      #   cli-<target>/  → omnivm-<version>-<target>/ folder with the binary
      #   desktop-<os>/  → installers (AppImage, .deb, .dmg, .exe, .zip)
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Restore CLI executables (single archive per target)
        run: |
          set -euo pipefail
          mkdir -p dist
          for d in artifacts/cli-*/; do
            target="$(basename "$d" | sed 's/^cli-//')"
            # the artifact contains the loose bundle folder; zip it once here
            if [ "$target" = "windows-x64" ]; then
              tar -a -cf "dist/omnivm-${TAG}-${target}.zip" -C "$d" .
            else
              tar -czf "dist/omnivm-${TAG}-${target}.tar.gz" -C "$d" .
            fi
          done

      - name: Collect desktop installers
        run: |
          set -euo pipefail
          find artifacts/desktop-* -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<EOF
          **OmniVM Workstation $TAG** — run virtual machines from your desktop.

          ## Desktop app (recommended)

          | Platform              | Installer                                  |
          |-----------------------|--------------------------------------------|
          | Windows x64           | OmniVM Setup $TAG.exe (or portable .zip)   |
          | macOS (Apple Silicon) | OmniVM-$TAG-arm64.dmg                      |
          | Linux                 | OmniVM-$TAG.AppImage or .deb               |

          Install and start **OmniVM** — a native window with the VM library,
          power controls, live console and snapshot manager.

          ## Terminal executables (CLI + TUI)

          | Platform              | Archive                                    |
          |-----------------------|--------------------------------------------|
          | Linux x64             | omnivm-$TAG-linux-x64.tar.gz               |
          | Linux arm64           | omnivm-$TAG-linux-arm64.tar.gz             |
          | macOS (Apple Silicon) | omnivm-$TAG-macos-arm64.zip                |
          | Windows x64           | omnivm-$TAG-windows-x64.zip                |

          \`\`\`
          tar xzf omnivm-$TAG-linux-x64.tar.gz
          ./omnivm-$TAG-linux-x64/omnivm doctor
          ./omnivm-$TAG-linux-x64/omnivm create myvm
          \`\`\`

          ## Notes

          - Everything is self-contained (runtime, x86 emulator, BIOS ROMs and
            the bundled OmniOS guest are embedded) — nothing else to install.
          - **macOS:** apps are ad-hoc signed, not notarized. If Gatekeeper
            complains: \`xattr -d com.apple.quarantine <app>\`
          - **Windows:** SmartScreen may warn — choose "More info" → "Run anyway".
          - VMs are stored in \`~/.omnivm\` by default (\`OMNIVM_HOME\` to change).

          SHA-256 checksums in checksums.txt.
          EOF
          gh release create "$TAG" dist/* \
            --title "OmniVM Workstation $TAG" \
            --notes-file notes.md \
            --latest
